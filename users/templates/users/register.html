{% extends 'resume/base.html' %}
{% block title %}Create your account · Findy-Job{% endblock %}

{% block content %}
<div class="auth">
  <div class="page-head">
    <h1>Create your account</h1>
    <p>It takes a minute. We’ll email you a 6-digit code to confirm.</p>
  </div>
  <div class="auth__panel">
    {{ props|json_script:"register-data" }}
    <div data-vue="register-form" data-props-id="register-data">
      <form method="post" class="form">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn--primary btn--block">Continue</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
