{% extends 'resume/base.html' %}
{% block title %}Welcome back · Findy-Job{% endblock %}

{% block content %}
<div class="auth">
  <div class="page-head">
    <h1>Welcome back</h1>
    <p>Log in to save resumes and manage your own.</p>
  </div>
  <div class="auth__panel">
    {{ props|json_script:"login-data" }}
    <div data-vue="login-form" data-props-id="login-data">
      <form method="post" class="form">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn--primary btn--block">Continue</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
