{% extends 'resume/base.html' %}
{% block title %}Edit resume · Findy-Job{% endblock %}

{% block content %}
<div class="page-head">
  <h1>Edit resume</h1>
  <p>Update your details. Changes are visible immediately.</p>
</div>
<div class="auth__panel" style="max-width: 760px">
  {{ props|json_script:"resume-form-data" }}
  <div data-vue="resume-form" data-props-id="resume-form-data">
    <form method="post" enctype="multipart/form-data" class="form">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn btn--primary">Save</button>
    </form>
  </div>
</div>
{% endblock %}
